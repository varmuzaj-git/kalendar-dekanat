name: Nasazení stránky

# Akce se sbírají na serveru agenta (weby některých farností blokují servery GitHubu),
# sem se jen nahraje výsledek → workflow stránku zveřejní.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verze souborů (cache)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub občas hned po nahrání balík ještě „nevidí“ (No artifacts named "github-pages") → zkusit znovu
      - name: Počkat a nasadit znovu
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
