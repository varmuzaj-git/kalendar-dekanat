name: Test nastavení (Groq + Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/test.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Groq klíč (bez vypsání)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then echo "GROQ_API_KEY CHYBÍ"; exit 1; fi
          code=$(curl -s -o /tmp/m.json -w '%{http_code}' -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models)
          echo "Groq /models HTTP $code"
          [ "$code" = "200" ] || exit 1
          echo "Počet modelů: $(grep -o '"id"' /tmp/m.json | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
